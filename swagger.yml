  /tyk/apis/oas:
    get:
      description: Call this operation when you need to retrieve all API definitions
        stored in the Tyk Gateway in OpenAPI Specification (OAS) format. Use it
        instead of the classic API list endpoint when you require
        standards-compliant OAS documents (e.g., for import into third-party
        tooling). Pass mode=public to obtain specs without the Tyk-specific
        x-tyk-api-gateway vendor extension. Returns an array of OAS 3.0 API
        definition objects; an empty array means no OAS-format APIs are
        configured.
      operationId: list_apis_oas
      parameters:
        - description: >-
            By default mode is empty which means it will return the Tyk API OAS
            spec including the x-tyk-api-gateway part. 
             When mode=public, the Tyk OAS API spec will exclude the x-tyk-api-gateway part in the response.
          example: public
          in: query
          name: mode
          required: false
          schema:
            type: string
            enum:
              - public
            description: "Allowed values: 'public' — when set, the response will omit the
              Tyk-specific x-tyk-api-gateway extension from each API spec,
              returning only the standard OAS portion. Omit this parameter to
              receive the full Tyk OAS spec including gateway configuration."
      responses:
        "200":
          content:
            application/json:
              examples:
                oasExampleList:
                  $ref: "#/components/examples/oasExampleList"
              schema:
                items:
                  allOf:
                    - type: object
                      description: A standard OpenAPI 3.0 document object representing the API
                        definition, extended with Tyk-specific fields via the
                        x-tyk-api-gateway extension.
                      properties:
                        openapi:
                          type: string
                          description: The OpenAPI version string, e.g. '3.0.3'.
                        info:
                          type: object
                          description: API metadata including title and version.
                        paths:
                          type: object
                          description: Path definitions for the API.
                        servers:
                          type: array
                          description: Server URL definitions.
                          items:
                            type: object
                        components:
                          type: object
                          description: Reusable schema components.
                    - $ref: "#/components/schemas/TykVendorExtension"
                type: array
          description: List of API definitions in Tyk OAS format.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: List all APIs in Tyk OAS API format.
      tags:
        - Tyk OAS APIs
    post:
      description: Create an API with Tyk OAS API format on the Tyk Gateway.
      operationId: create_api_oas
      parameters:
        - description: The base API which the new version will be linked to.
          example: 663a4ed9b6be920001b191ae
          in: query
          name: base_api_id
          required: false
          schema:
            type: string
        - description: The version name of the base API while creating the first version.
            This doesn't have to be sent for the next versions but if it is set,
            it will override base API version name.
          example: Default
          in: query
          name: base_api_version_name
          required: false
          schema:
            type: string
        - description: The version name of the created version.
          example: v2
          in: query
          name: new_version_name
          required: false
          schema:
            type: string
        - description: If true, the new version is set as default version.
          example: true
          in: query
          name: set_default
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            example:
              components:
                securitySchemes:
                  bearerAuth:
                    description: The API Access Credentials
                    scheme: bearer
                    type: http
              info:
                description: This is a sample OAS.
                title: OAS Sample
                version: 1.0.0
              openapi: 3.0.3
              paths:
                /api/sample/users:
                  get:
                    operationId: getUsers
                    responses:
                      "200":
                        content:
                          application/json:
                            schema:
                              items:
                                properties:
                                  name:
                                    type: string
                                    description: The name of the user.
                                type: object
                              type: array
                        description: fetched users
                    summary: Get users
                    tags:
                      - users
              security:
                - bearerAuth: []
              servers:
                - url: https://localhost:8080
              x-tyk-api-gateway:
                info:
                  name: user
                  state:
                    active: true
                server:
                  listenPath:
                    strip: true
                    value: /user-test/
                upstream:
                  url: https://localhost:8080
            schema:
              allOf:
                - type: object
                  description: A standard OpenAPI 3.0 document. Must include at minimum the
                    'openapi', 'info', 'paths', and 'servers' fields, plus the
                    Tyk-specific 'x-tyk-api-gateway' extension describing
                    gateway behaviour such as listenPath and upstream URL.
                  properties:
                    openapi:
                      type: string
                      description: OpenAPI version, e.g. '3.0.3'.
                    info:
                      type: object
                      description: API metadata (title, version, description).
                    paths:
                      type: object
                      description: Defines the available API paths and their operations.
                    servers:
                      type: array
                      description: Target server URLs.
                      items:
                        type: object
                    components:
                      type: object
                      description: Reusable schemas, security schemes, and other components.
                    security:
                      type: array
                      description: Global security requirements.
                      items:
                        type: object
                  $ref: Bundle or inline the external schema locally, e.g. replace the $ref with
                    an inline schema or a local $ref such as
                    "#/components/schemas/OASSchema".
                - $ref: "#/components/schemas/TykVendorExtension"
      responses:
        "200":
          content:
            application/json:
              example:
                action: added
                key: e30bee13ad4248c3b529a4c58bb7be4e
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: API created.
        "400":
          content:
            application/json:
              example:
                message: the payload should contain x-tyk-api-gateway
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                message: file object creation failed, write error
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Create an API with Tyk OAS format.
      tags:
        - Tyk OAS APIs
