  /tyk/oauth/clients/{apiID}:
    get:
      description: Use this operation to retrieve all OAuth 2.0 clients registered
        under a specific API. Call it when you need to look up client IDs,
        secrets, redirect URIs, or metadata for clients belonging to a given API
        (identified by `apiID`). The response is an array of OAuth client
        objects; each entry includes `client_id`, `secret`, `redirect_uri`, and
        optional `meta_data`. Returns 404 if the API ID does not exist, and 403
        if admin credentials are missing or invalid.
      operationId: list_oauth_clients
      parameters:
        - description: The API ID
          example: 1bd5c61b0e694082902cf15ddcc9e6a7
          in: path
          name: apiID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                - api_id: b84fe1a04e5648927971c0557971565c
                  client_id: 2a06b398c17f46908de3dffcb71ef87df
                  description: google client
                  meta_data:
                    user_id: 362b3fb9a1d5e4f00017226f5
                  redirect_uri: https://httpbin.org/ip
                  secret: MmQwNTI5NGQtYjU0YS00NjMyLWIwZjktNTZjY2M1ZjhjYWY0
              schema:
                items:
                  $ref: "#/components/schemas/NewClientRequest"
                type: array
          description: Get OAuth client details or a list of OAuth clients
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          description: Api no found
      summary: List oAuth clients
      tags:
        - OAuth
  /tyk/oauth/clients/{apiID}/{keyName}:
    delete:
      description: Delete a registered OAuth client from a specific API. Use this tool
        when you want to remove an OAuth client so it can no longer be used to
        obtain new tokens. Note that any tokens already issued with this client
        ID will remain valid until they expire. Requires both the API ID (apiID)
        and the OAuth Client ID (keyName). On success, returns a confirmation
        object with the deleted client ID and action 'deleted'.
      operationId: delete_oauth_client
      parameters:
        - description: The API id
          example: b84fe1a04e5648927971c0557971565c
          in: path
          name: apiID
