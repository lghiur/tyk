    delete:
      description: Delete all expired (lapsed) OAuth tokens from the Tyk gateway
        store. Call this tool during maintenance windows or scheduled cleanup
        tasks to free storage and improve lookup performance. The required query
        parameter 'scope' must be set to 'lapsed'; any other value returns a 400
        error. Returns a status message confirming the purge on success.
      operationId: purge_lapsed_oauth_tokens
      parameters:
        - description: purge lapsed tokens
          example: lapsed
          in: query
          name: scope
          required: true
          schema:
            type: string
            enum:
              - lapsed
            description: "Allowed value: 'lapsed' — targets all OAuth tokens whose expiry
              time has passed and that are no longer valid."
      responses:
        "200":
          content:
            application/json:
              example:
                message: lapsed tokens purged
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: lapsed tokens purged successfully
        "400":
          content:
            application/json:
              example:
                message: unknown scope
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Sending a value other than lapsed in scope query
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "422":
          content:
            application/json:
              example:
                message: scope parameter is required
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Missing lapsed query parameter
        "500":
