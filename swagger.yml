  /tyk/oauth/clients/{apiID}/{keyName}/tokens:
    get:
      description: >-
        This endpoint allows you to retrieve a list of all current tokens and
        their expiry date for a provided API ID and OAuth-client ID .If page
        query parameter is sent the tokens will be paginated. This endpoint will
        work only for newly created tokens.
                <br/>
                <br/>
                You can control how long you want to store expired tokens in this list using `oauth_token_expired_retain_period` gateway option, which specifies retain period for expired tokens stored in Redis. By default expired token not get removed. See <a href="https://tyk.io/docs/configure/tyk-gateway-configuration-options/#a-name-oauth-token-expired-retain-period-a-oauth-token-expired-retain-period" target="_blank">here</a> for more details.
      operationId: get_oauth_client_tokens
      parameters:
        - description: The API id
          example: b84fe1a04e5648927971c0557971565c
          in: path
          name: apiID
          required: true
          schema:
            type: string
        - description: The OAuth client ID whose tokens you want to list. Corresponds to
            the client_id of the registered OAuth application.
          example: 2a06b398c17f46908de3dffcb71ef87df
          in: path
          name: keyName
          required: true
          schema:
            type: string
        - description: Use page query parameter to say which page number you want returned.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              examples:
                paginatedTokenExample:
                  $ref: "#/components/examples/paginatedTokenExample"
                tokenListExample:
                  $ref: "#/components/examples/tokenListExample"
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PaginatedOAuthClientTokens"
                  - items:
                      $ref: "#/components/schemas/OAuthClientToken"
                    nullable: true
                    type: array
          description: Returns an array of OAuthClientToken objects (each with a token
            string and expiry date) when no page parameter is given, or a
            PaginatedOAuthClientTokens object (with pagination metadata and a
            tokens array) when the page parameter is supplied.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: OAuth Client ID not found
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: OAuth Client ID not found
        "500":
          content:
            application/json:
              example:
                message: Get client tokens failed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: List tokens for a provided API ID and OAuth-client ID
      tags:
        - OAuth
  /tyk/oauth/clients/apis/{appID}:
    get:
      description: Get all API IDs for APIs that have use_oauth2 enabled and use the
        client_id (appID) specified in the path parameter for OAuth2. You can
        use the org_id query parameter to specify from which organization you
        want the API IDs to be returned. To return APIs from all organizations,
        send org_id as an empty string.
      operationId: get_apis_for_oauth_app
      parameters:
        - description: The Client ID
          example: 2a06b398c17f46908de3dffcb71ef87df
          in: path
          name: appID
          required: true
          schema:
            type: string
        - description: Filter results to a specific organization by providing its org ID.
            To return APIs from all organizations, pass an empty string. If
            omitted, behavior may default to the authenticated user's
            organization.
          in: query
          name: orgID
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                - b84fe1a04e5648927971c0557971565c
              schema:
                items:
                  type: string
                type: array
          description: Returns a JSON array of API ID strings (e.g.
            ["b84fe1a04e5648927971c0557971565c"]) for all APIs that have
            use_oauth2 enabled and reference the specified OAuth client_id.
            These API IDs can be used in other OAuth endpoints such as GET
            /tyk/oauth/clients/{apiID}/{keyName}/tokens.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Get API IDs for APIS that use the specified client_id(appID) for OAuth
      tags:
        - OAuth
  /tyk/oauth/clients/create:
    post:
      description: Call this endpoint to register a new OAuth client application with
        Tyk before generating OAuth tokens. An OAuth client ID is required for
        all OAuth token generation flows. Provide api_id to link the client to a
        single API, or omit api_id and use policy access rights to grant the
        client access to multiple APIs (Tyk Gateway 2.6.0+). Call this once per
        OAuth application; subsequent token requests reference the client_id
        returned here.
      operationId: create_oauth_client
      requestBody:
        content:
          application/json:
            example:
              api_id: b84fe1a04e5648927971c0557971565c
              client_id: 2a06b398c17f46908de3dffcb71ef87df
              description: google client
              meta_data:
                user_id: 362b3fb9a1d5e4f00017226f5
              redirect_uri: https://httpbin.org/ip
              secret: MmQwNTI5NGQtYjU0YS00NjMyLWIwZjktNTZjY2M1ZjhjYWY0
            schema:
              $ref: "#/components/schemas/NewClientRequest"
      responses:
        "200":
          content:
            application/json:
              example:
                client_id: 2a06b398c17f46908de3dffcb71ef87df
                description: google client
                meta_data:
                  user_id: 362b3fb9a1d5e4f00017226f5
                redirect_uri: https://httpbin.org/ip
                secret: MmQwNTI5NGQtYjU0YS00NjMyLWIwZjktNTZjY2M1ZjhjYWY0
              schema:
                $ref: "#/components/schemas/NewClientRequest"
          description: Returns the newly created OAuth client object, including the
