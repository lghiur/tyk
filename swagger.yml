  /tyk/reload:
    get:
      description: Tyk is capable of reloading configurations without having to stop
        serving requests. This means that API configurations can be added at
        runtime, or even modified at runtime and those rules applied immediately
        without any downtime.
      operationId: hot_reload
      parameters:
        - description: Block a response until the reload is performed. This can be useful
            in scripting environments like CI/CD workflows.
          example: false
          in: query
          name: block
          required: false
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              example:
                message: ""
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Reload gateway.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Hot-reload a single node.
      tags:
        - Hot Reload
  /tyk/reload/group:
    get:
      description: To reload a whole group of Tyk nodes (without using the Dashboard
        or host manager). You can send an API request to a single node, this
        node will then send a notification through the pub/sub infrastructure to
        all other listening nodes (including the host manager if it is being
        used to manage Nginx) which will then trigger a global reload.
      operationId: hot_reload_group
      responses:
        "200":
          content:
            application/json:
              example:
                message: ""
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Reload the Tyk Gateway.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Hot-reload a group of Tyk nodes.
      tags:
        - Hot Reload
  /{listen_path}/tyk/batch:
    post:
      description: Use this operation to send multiple API sub-requests in a single
        HTTP call through Tyk's batch processing endpoint. Each sub-request
        specifies a method, relative URL, headers, and optional body. Set
        'suppress_parallel_execution' to true to force sequential execution, or
        false (default) to allow parallel processing. The response is an array
        of replies — one per sub-request — each containing the HTTP status code,
        response body, headers, and relative URL. The listen_path path parameter
        must match the API's configured listen path in Tyk. Returns 400 if the
        batch request body is malformed, or 403 if the caller lacks a valid
        authorization key.
      operationId: batch
      parameters:
        - description: API listen path
          example: get
          in: path
          name: listen_path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              requests:
                - body: ""
                  headers:
                    authorization: 1dbc83b9c431649d7698faa9797e2900f
                    x-tyk-test: "1"
                    x-tyk-version: "1.2"
                  method: GET
                  relative_url: get
                - body: ""
                  headers:
                    authorization: 1dbc83b9c431649d7698faa9797e2900f
                    x-tyk-test: "2"
                    x-tyk-version: "1.2"
                  method: GET
                  relative_url: get
              suppress_parallel_execution: false
            schema:
              $ref: "#/components/schemas/BatchRequestStructure"
      responses:
        "200":
          content:
            application/json:
              example:
                - body: '{"message": "success"}'
                  code: 200
                  headers:
                    Access-Control-Allow-Credentials:
                      - "true"
                    Content-Type:
                      - application/json
                  relative_url: get
              schema:
                items:
                  $ref: "#/components/schemas/BatchReplyUnit"
                type: array
          description: Success.
        "400":
          content:
            application/json:
              example:
                message: Batch request malformed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Run batch request.
      tags:
        - Batch requests
  /tyk/schema:
    get:
      description: Retrieves the OpenAPI Specification (OAS) JSON schema definition
        for a given OAS version (e.g. '3.0.3'). Call this tool when you need to
        validate, inspect, or reference the schema structure used by Tyk for OAS
        API definitions. If 'oasVersion' is omitted the default version is
        returned. On success the response contains the full JSON schema object.
        Returns 404 if the requested version does not exist, and 403 if the
        caller lacks administrative credentials.
      operationId: get_schema
      parameters:
        - description: The OAS version to fetch.
          example: 3.0.3
          in: query
          name: oasVersion
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                message: ""
                status: Success
              schema:
                $ref: "#/components/schemas/OASSchemaResponse"
          description: OAS schema response.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: Schema not found for version "4"
                status: Failed
              schema:
                $ref: "#/components/schemas/OASSchemaResponse"
          description: Version not found
      summary: Get OAS schema.
      tags:
        - Schema
