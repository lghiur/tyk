      description: >-
        Import an Tyk OAS format API without x-tyk-gateway.
         For use with an existing Tyk OAS API that you want to expose via your Tyk Gateway.
      operationId: import_oas
      parameters:
        - $ref: "#/components/parameters/UpstreamURL"
        - $ref: "#/components/parameters/ListenPath"
        - $ref: "#/components/parameters/CustomDomain"
        - $ref: "#/components/parameters/AllowList"
        - $ref: "#/components/parameters/ValidateRequest"
        - $ref: "#/components/parameters/MockResponse"
        - $ref: "#/components/parameters/Authentication"
        - description: The base API which the new version will be linked to.
          example: 663a4ed9b6be920001b191ae
          in: query
          name: base_api_id
          required: false
          schema:
            type: string
        - description: The version name of the base API while creating the first version.
            This doesn't have to be sent for the next versions but if it is set,
            it will override base API version name.
          example: Default
          in: query
          name: base_api_version_name
          required: false
          schema:
            type: string
        - description: The version name of the created version.
          example: v2
          in: query
          name: new_version_name
          required: false
          schema:
            type: string
        - description: If true, the new version is set as default version.
          example: true
          in: query
          name: set_default
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            example:
              components:
                securitySchemes:
                  bearerAuth:
                    description: The API Access Credentials
                    scheme: bearer
                    type: http
              info:
                description: This is a sample OAS.
                title: OAS Sample
                version: 1.0.0
              openapi: 3.0.3
              paths:
                /api/sample/users:
                  get:
                    operationId: getUsers
                    responses:
                      "200":
                        content:
                          application/json:
                            schema:
                              items:
                                properties:
                                  name:
                                    type: string
                                    description: The name of the user.
                                type: object
                              type: array
                        description: fetched users
                    summary: Get users
                    tags:
                      - users
              security:
                - bearerAuth: []
              servers:
                - url: https://localhost:8080
            schema:
              type: object
              description: A standard OpenAPI 3.0 document to import into Tyk as a new API
                definition. Must NOT contain the x-tyk-api-gateway Tyk vendor
                extension — Tyk will generate the extension automatically based
                on the provided query parameters (upstreamURL, listenPath,
                etc.). The document must include valid 'info', 'paths', and
                optionally 'servers' and 'components' sections.
              additionalProperties: true
              $ref: "#/components/schemas/TykOASApiDefinition"
      responses:
        "200":
          content:
            application/json:
              example:
                action: added
                key: e30bee13ad4248c3b529a4c58bb7be4e
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: API imported.
        "400":
          content:
            application/json:
              example:
                message: the import payload should not contain x-tyk-api-gateway
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                message: file object creation failed, write error
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Import an API in Tyk OAS format.
      tags:
        - Tyk OAS APIs
  /tyk/mcps:
    get:
      description: List all MCP Proxy definitions on this Tyk Gateway. Each entry is a
        Tyk OAS document whose Tyk Vendor Extension extension marks it as an MCP
        Proxy definition.
      operationId: list_mcps
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                description: A list of MCP Proxy definitions. Each item is a Tyk OAS document
                  (OpenAPI 3.0) that includes the x-tyk-api-gateway vendor
                  extension with MCP configuration under middleware.mcpTools.
                items:
                  type: object
                  description: A Tyk OAS API definition document representing an MCP Proxy.
                    Includes standard OpenAPI 3.0 fields (info, paths, servers,
                    components) as well as the x-tyk-api-gateway vendor
                    extension containing MCP-specific middleware configuration.
                  additionalProperties: true
          description: List of MCP Proxy definitions.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: List MCP Proxy definitions.
      tags:
        - MCP Proxies
    post:
      description: >
        Create an MCP Proxy definition from a Tyk OAS document. The payload must

        contain the Tyk Vendor Extension (`x-tyk-api-gateway`) extension with
        MCP configuration and is

        validated against the MCP JSON schema (`/tyk/schema?type=mcp`) before
        being

        stored. The Gateway must be reloaded (`POST /tyk/reload`) for the new
        MCP

        Proxy definition to take effect.
      operationId: create_mcp
      requestBody:
        content:
          application/json:
            example:
              openapi: 3.0.3
              info:
                title: MCP Proxy Sample
                version: 1.0.0
              paths: {}
              components: {}
              servers:
                - url: /mcp-sample/
              x-tyk-api-gateway:
                info:
                  name: mcp-sample
                  state:
                    active: true
                server:
                  listenPath:
                    strip: true
                    value: /mcp-sample/
                  authentication:
                    enabled: true
                    securitySchemes:
                      authToken:
                        enabled: true
                upstream:
                  url: http://localhost:7878/mcp
                middleware:
                  global:
                    contextVariables:
                      enabled: true
                    trafficLogs:
                      enabled: true
                  mcpTools: {}
                  operations: {}
            schema:
              type: object
              description: A Tyk OAS API definition document for an MCP Proxy. Must be a valid
                OpenAPI 3.0 document and must contain the x-tyk-api-gateway
                vendor extension with MCP configuration (including
                middleware.mcpTools). The document is validated against the MCP
                JSON schema before being stored. After creation, call POST
                /tyk/reload to make the new MCP Proxy definition take effect.
              additionalProperties: true
      responses:
        "200":
          content:
            application/json:
              example:
                action: added
                key: e30bee13ad4248c3b529a4c58bb7be4e
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: MCP Proxy definition created.
        "400":
          content:
            application/json:
              example:
                message: the payload should contain x-tyk-api-gateway
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Validation failed (invalid OAS, missing `x-tyk-api-gateway`, or
            schema violation).
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Create an MCP Proxy definition.
      tags:
        - MCP Proxies
  /tyk/mcps/{apiID}:
    parameters:
      - description: The MCP Proxy definition ID.
        in: path
        name: apiID
        required: true
        schema:
          type: string
    get:
      description: Retrieve a single MCP Proxy definition by its unique API ID. Use
        this operation when you need to inspect, verify, or display the full Tyk
        OAS document (including the `x-tyk-api-gateway` MCP configuration) for a
        specific MCP Proxy. The `apiID` path parameter is the identifier
        returned when the MCP Proxy was created (see `POST /tyk/mcps`). Returns
        the complete Tyk OAS document with the Tyk Vendor Extension on success,
        or a 404 error if no MCP Proxy with the given ID exists.
      operationId: get_mcp
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    description: An OpenAPI 3.0 document representing the MCP Proxy definition,
                      including info, paths, components, and servers fields.
                    properties:
                      openapi:
                        type: string
                        example: 3.0.3
                      info:
                        type: object
                        properties:
                          title:
                            type: string
                          version:
                            type: string
                        required:
                          - title
                          - version
                      paths:
                        type: object
                        additionalProperties:
                          type: object
                      components:
                        type: object
                      servers:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                            - url
                    required:
                      - openapi
                      - info
                      - paths
                    $ref: "#/components/schemas/TykOASApiDefinition"
                  - $ref: "#/components/schemas/TykVendorExtension"
          description: The MCP Proxy definition.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: MCP Proxy definition not found.
      summary: Get an MCP Proxy definition.
      tags:
        - MCP Proxies
    put:
      description: Update an existing MCP Proxy definition. Body is validated against
        the MCP JSON schema. A Gateway reload is required for changes to take
        effect.
      operationId: update_mcp
      requestBody:
        content:
          application/json:
            example:
              openapi: 3.0.3
              info:
                title: MCP Proxy Sample
                version: 1.0.0
              paths: {}
              components: {}
              servers:
                - url: /mcp-sample/
              x-tyk-api-gateway:
                info:
                  name: mcp-sample
                  state:
                    active: true
                server:
                  listenPath:
                    strip: true
                    value: /mcp-sample/
                  authentication:
                    enabled: true
                    securitySchemes:
                      authToken:
                        enabled: true
                upstream:
                  url: http://localhost:7878/mcp
                middleware:
                  global:
                    contextVariables:
                      enabled: true
                    trafficLogs:
                      enabled: true
                  mcpTools: {}
                  operations: {}
            schema:
              allOf:
                - type: object
                  description: An OpenAPI 3.0 document representing the MCP Proxy definition to
                    update, including info, paths, components, and servers
                    fields.
                  properties:
                    openapi:
                      type: string
                      example: 3.0.3
                    info:
                      type: object
                      properties:
                        title:
                          type: string
                        version:
                          type: string
                      required:
                        - title
                        - version
                    paths:
                      type: object
                      additionalProperties:
                        type: object
                    components:
                      type: object
                    servers:
                      type: array
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                        required:
                          - url
                  required:
                    - openapi
                    - info
                    - paths
                  $ref: "#/components/schemas/OASDefinition"
                - $ref: "#/components/schemas/TykVendorExtension"
      responses:
        "200":
          content:
            application/json:
              example:
                action: modified
                key: e30bee13ad4248c3b529a4c58bb7be4e
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: MCP Proxy definition updated.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Validation failed.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: MCP Proxy definition not found.
      summary: Update an MCP Proxy definition.
      tags:
        - MCP Proxies
    delete:
      description: Delete an MCP Proxy definition. A Gateway reload is required to
        unload the proxy from the running Gateway.
      operationId: delete_mcp
      responses:
        "200":
          content:
            application/json:
              example:
                action: deleted
                key: e30bee13ad4248c3b529a4c58bb7be4e
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: MCP Proxy definition deleted.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: MCP Proxy definition not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Delete failed.
      summary: Delete an MCP Proxy definition.
      tags:
        - MCP Proxies
  /tyk/cache/{apiID}:
    delete:
      description: Invalidate (flush) all cached response entries for the specified
        API. Call this tool when you need to force the Gateway to stop serving
        stale cached responses — for example, after updating upstream data or
        changing API configuration. Requires a valid admin API key. Returns a
        confirmation message on success. Note that after invalidation, the first
        requests to the API will hit the upstream until the cache is
        repopulated.
      operationId: invalidate_cache
      parameters:
        - description: The API ID.
          example: ae67bb862a3241a49117508e0f9ee839
          in: path
          name: apiID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                message: cache invalidated
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Cache invalidated.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                message: Cache invalidation failed.
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Invalidate cache.
      tags:
        - Cache Invalidation
  /tyk/cache/jwks/{apiID}:
    delete:
      description: Invalidate (flush) the cached JSON Web Key Set (JWKS) for the
        specified API. Call this tool when the upstream identity provider has
        rotated or changed its signing keys and the Gateway must fetch fresh
        keys on the next JWT-authenticated request. Requires a valid admin API
        key. Returns a confirmation message on success. Without invalidation,
        the Gateway may continue to validate tokens against outdated public
        keys, causing authentication failures for newly issued tokens.
      operationId: invalidate_jwkcache
      parameters:
        - description: The API ID.
          example: ae67bb862a3241a49117508e0f9ee839
          in: path
          name: apiID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                message: cache invalidated
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Cache invalidated.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Invalidate cache for given API ID.
      tags:
        - JWK Cache Invalidation
  /tyk/cache/jwks:
    delete:
      description: Invalidate the JWK (JSON Web Key) cache for all APIs configured in
        the Tyk Gateway. Call this tool after rotating or updating JWKs in your
        identity provider so that Tyk fetches fresh keys on the next request
        requiring JWT validation. On success the gateway returns a status
        message confirming the cache has been cleared. Requires a valid admin
        API key; a 403 is returned if the key is missing or invalid.
      operationId: invalidate_jwkcache_for_all_apis
      responses:
        "200":
          content:
            application/json:
              example:
                message: cache invalidated
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Cache invalidated.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Invalidate JWK cache for all APIs
      tags:
        - JWK cache invalidation
  /tyk/certs:
    get:
      description: Retrieve certificates stored in the Tyk Gateway. Use this tool to
        audit available certificates, check expiry, or find a certificate ID
        before referencing it in an API definition. Optionally filter by
        organisation using 'org_id'. Omitting 'mode' returns a flat list of
        certificate IDs; setting 'mode=detailed' returns an array of objects
        with full certificate metadata (subject, expiry, fingerprint, etc.).
        Requires a valid admin API key.
      operationId: list_certs
      parameters:
        - description: Organisation ID to list the certificates.
          example: 5e9d9544a1dcd60001d0ed20
          in: query
          name: org_id
          required: false
          schema:
            type: string
        - description: Mode to list the certificate details.
          example: detailed
          in: query
          name: mode
          required: false
          schema:
            type: string
            enum:
              - detailed
            description: Controls the verbosity of the returned certificate information.
              Omit this parameter to receive a plain list of certificate ID
              strings. Set to 'detailed' to receive full certificate metadata
              objects (subject, issuer, expiry date, SHA256 fingerprint, etc.)
              for each certificate.
      responses:
        "200":
          content:
            application/json:
              examples:
                certIdList:
                  $ref: "#/components/examples/certIdList"
                certificateBasicList:
                  $ref: "#/components/examples/certificateBasicList"
              schema:
                oneOf:
                  - $ref: "#/components/schemas/APIAllCertificateBasics"
                  - $ref: "#/components/schemas/APIAllCertificates"
          description: OK
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: List certificates.
      tags:
        - Certs
    post:
      description: "Upload a new certificate (and optionally its private key) to the
        Tyk Gateway certificate store so it can be referenced in API definitions
        for mutual TLS or upstream certificate pinning. The request body must be
        a PEM-encoded certificate or certificate+key pair sent as plain text
        (Content-Type: text/plain). On success the gateway returns the generated
        certificate ID which you should store for later reference. Returns 403
        if the certificate already exists, and 405 if the body is malformed.
        Optionally scope the certificate to a specific organisation using
        'org_id'."
      operationId: add_cert
      parameters:
        - description: Organisation ID to add the certificate to.
          example: 5e9d9544a1dcd60001d0ed20
          in: query
          name: org_id
          required: false
          schema:
            type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          content:
            application/json:
              example:
                id: 5e9d9544a1dcd60001d0ed207c440d66ebb0a4629d21329808dce9091acf5f2fde328067a6e60e5347271d90
                message: Certificate added
                status: ok
              schema:
                $ref: "#/components/schemas/APICertificateStatusMessage"
          description: New certificate added.
        "403":
          content:
            application/json:
              example:
                message: Certificate with  ID already exists.
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: When certificates you send already exist in the gateway.
        "405":
          content:
            application/json:
              example:
                message: Malformed request body
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Malformed request body.
      summary: Add a certificate.
      tags:
        - Certs
  /tyk/certs/{certID}:
    delete:
      description: "Use this operation to permanently remove a specific certificate
        from Tyk's certificate store by its certificate ID. Call this when you
        need to revoke or clean up an individual TLS/mTLS certificate that is no
        longer required. Supply the certID path parameter (the certificate's
        unique storage identifier, not the fingerprint) and optionally an org_id
        query parameter to scope the deletion to a specific organisation. On
        success the response body contains {\"status\": \"ok\", \"message\":
        \"removed\"}. This action is irreversible — the certificate cannot be
        recovered after deletion."
      operationId: delete_certs
      parameters:
        - description: Certificate ID to be deleted.
          example: 5e9d9544a1dcd60001d0ed20a6ab77653d5da938f452bb8cc9b55b0630a6743dabd8dc92bfb025abb09ce035
          in: path
          name: certID
          required: true
          schema:
            type: string
        - description: Organisation ID to delete the certificates from.
          example: 5e9d9544a1dcd60001d0ed20
          in: query
          name: org_id
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                message: removed
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Deleted certificate.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Delete certificate.
      tags:
        - Certs
    get:
      description: >-
        Note that the certID path parameter can take a list of certIDs separated
        with commas (e.g /tyk/certs/certIDOne,certIDTwo).
         If you send a single certID it will return a single CertificateMeta object otherwise if you send more than two certIDs is will return an array of certificateMeta objects.
      operationId: list_certs_with_ids
      parameters:
        - description: Comma separated list of certificates to list.
          example: e6ce2b49-3e31-44de-95a7-12f054724283,5e9d9544a1dcd60001d0ed20a6ab77653d5da938f452bb8cc9b55b0630a6743dabd8dc92bfb025abb09ce035
          in: path
          name: certID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                certificateMetaExample:
                  $ref: "#/components/examples/certificateMetaExample"
                certificateMetaListExample:
                  $ref: "#/components/examples/certificateMetaListExample"
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CertsCertificateMeta"
                  - items:
                      $ref: "#/components/schemas/CertsCertificateMeta"
                    nullable: true
                    type: array
          description: OK
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: Certificate with given SHA256 fingerprint not found.
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Not Found
      summary: Return one certificate or list multiple certificates in the Tyk Gateway
        given a comma separated list of cert IDs.
      tags:
        - Certs
  /tyk/debug:
    post:
      description: Used to test API definition by sending sample request and analysing
        output of both response and logs.
      operationId: debug_api_definition
      requestBody:
        content:
          application/json:
            examples:
              apiDefinition:
                summary: Calling debug endpoint with classic API definition.
                value:
                  request:
                    method: GET
                    path: /update-listen-path
                  spec:
                    api_id: b84fe1a04e5648927971c0557971565c
                    auth:
                      auth_header_name: authorization
                    definition:
                      key: version
                      location: header
                    name: Tyk Test API
                    org_id: 664a14650619d40001f1f00f
                    proxy:
                      listen_path: /tyk-api-test/
                      strip_listen_path: true
                      target_url: https://httpbin.org
                    use_oauth2: true
                    version_data:
                      not_versioned: true
                      versions:
                        Default:
                          name: Default
              oasApiDefinition:
                summary: Calling debug endpoint with Tyk OAS API definition.
                value:
                  request:
                    method: GET
                    path: /get
                  oas:
                    info:
                      title: testdebug
                      version: 1.0.0
                    openapi: 3.0.3
                    servers:
                      - url: http://localhost:8181/testdebug/
                    security: []
                    paths: {}
                    components:
                      securitySchemes: {}
                    x-tyk-api-gateway:
                      info:
                        dbId: 67a25ff65b60081c8731464f
                        id: d37ea0e360c245cf406d640f1dbf788d
                        orgId: 645b3db586341f751f4258aa
                        name: testdebug
                        state:
                          active: true
                          internal: false
                      middleware:
                        global:
                          contextVariables:
                            enabled: true
                          trafficLogs:
                            enabled: true
                      server:
                        listenPath:
                          strip: true
                          value: /testdebug/
                      upstream:
                        url: http://httpbin.org/
            schema:
              $ref: "#/components/schemas/TraceRequest"
      responses:
        "200":
          content:
            application/json:
              example:
                logs: '{"level":"warning","msg":"Legacy path detected! Upgrade to extended....'
                message: ok
                response: "====== Request ======

                  GET / HTTP/1.1\r

                  Host: httpbin.org\r

                  \r


                  ====== Response..."
              schema:
                $ref: "#/components/schemas/TraceResponse"
          description: Success tracing request.
        "400":
