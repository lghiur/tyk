openapi: 3.0.3
info:
  contact:
    email: support@tyk.io
    name: Tyk Technologies
    url: https://tyk.io/contact
  description: >+
    <img src="https://tyk.io/docs/img/swagger_gateway_image.png" width="963"
    height="250">

    <img src="https://tyk.io/docs/img/swagger_gateway_direction_image.png"
    width="946" height="392">


    The Tyk Gateway API is the primary means for integrating your application
    with the Tyk API Gateway system. This API is very small, and has no granular
    permissions system. It is intended to be used purely for internal automation
    and integration.


    **Warning: Under no circumstances should outside parties be granted access
    to this API.**


    The Tyk Gateway API is capable of:


    * Managing session objects (key generation).

    * Managing and listing policies.

    * Managing and listing API Definitions (only when not using the Tyk
    Dashboard).

    * Hot reloads / reloading a cluster configuration.

    * OAuth client creation (only when not using the Tyk Dashboard).


    In order to use the Gateway API, you'll need to set the **secret** parameter
    in your tyk.conf file.


    The shared secret you set should then be sent along as a header with each
    Gateway API Request in order for it to be successful:


    **x-tyk-authorization: <your-secret>***

    <br/>


    <b>The Tyk Gateway API is subsumed by the Tyk Dashboard API in Pro
    installations.</b>

  license:
    name: Mozilla Public License Version 2.0
    url: https://github.com/TykTechnologies/tyk/blob/master/LICENSE.md
  title: Tyk Gateway API
  version: 5.11.0
servers:
  - url: https://{tenant}
    variables:
      tenant:
        default: localhost:8080
        description: Your gateway host
security:
  - api_key: []
tags:
  - description: >
      **Note: Applies only to Tyk Gateway Community Edition** <br/>


      API management is very simple using the Tyk Rest API: each update only
      affects the underlying file, and this endpoint will only work with disk
      based installations, not database-backed ones.<br/>


      APIs that are added this way are flushed to to disk into the app_path
      folder using the format: *{api-id}.json*. Updating existing APIs that use
      a different naming convention will cause those APIs to be added, which
      could subsequently lead to a loading error and crash if they use the same
      listen_path. <br/>


      These methods only work on a single API node. If updating a cluster, it is
      important to ensure that all nodes are updated before initiating a
      reload.<br/>
    name: APIs
  - description: |+
      **Note: Applies only to Tyk Gateway Community Edition** <br/>

    name: Tyk OAS APIs
  - description: >
      Manage MCP (Model Context Protocol) Proxies on Tyk Gateway. MCP Proxies
      are

      defined as Tyk OAS documents that include MCP-specific configuration in
      the

      Tyk Vendor Extension (`x-tyk-api-gateway`). All create/update requests are
      validated against

      the MCP JSON schema; a Gateway reload is required for changes to take
      effect.
    name: MCP Proxies
  - description: >
      All keys that are used to access services via Tyk correspond to a session
      object that informs Tyk about the context of this particular token, like
      access rules and rate/quota allowance.
    name: Keys
  - description: >
      It is possible to force API quota and rate limit across all keys that
      belong to a specific organisation ID. Rate limiting at an organisation
      level is useful for creating tiered access levels and trial accounts.<br
      />


      The Organisation rate limiting middleware works with both Quotas and Rate
      Limiters. In order to manage this functionality, a simple API has been put
      in place to manage these sessions. <br />


      Although the Organisation session-limiter uses the same session object,
      all other security keys are optional as they are not used. <br />


      <h3>Managing active status</h3> <br />


      To disallow access to an entire group of keys without rate limiting the
      organisation, create a session object with the "is_inactive" key set to
      true. This will block access before any other middleware is executed. It
      is useful when managing subscriptions for an organisation group and access
      needs to be blocked because of non-payment. <br />
    name: Organisation Quotas
  - description: >
      Sometimes a cache might contain stale data, or it may just need to be
      cleared because of an invalid configuration. This call will purge all keys
      associated with a cache on an API-by-API basis.
    name: Cache Invalidation
  - description: Use the endpoints under this tag to manage your certificates. You
      can add, delete and list certificates using these endpoints.
    name: Certs
  - description: |
      Force restart of the Gateway or whole cluster.
    name: Hot Reload
  - description: |
      Check health status of the Tyk Gateway and loaded APIs.
    name: Health Checking
  - description: >
      A Tyk security policy incorporates several security options that can be
      applied to an API key. It acts as a template that can override individual
      sections of an API key (or identity) in Tyk.
    name: Policies
  - description: |
      Manage OAuth clients, and manage their tokens
    name: OAuth
  - description: >
      Tyk supports batch requests, so a client makes a single request to the API
      but gets a compound response object back.


      This is especially handy if clients have complex requests that have
      multiple synchronous dependencies and do not wish to have the entire
      request / response cycle running for each event.


      To enable batch request support, set the `enable_batch_request_support`
      value to `true`


      Batch requests that come into Tyk are *run through the whole Tyk
      machinery* and *use a relative path to prevent spamming*. This means that
      a batch request to Tyk for three resources with the same API key will have
      three requests applied to their session quota and request limiting could
      become active if they are being throttled.


      Tyk reconstructs the API request based on the data in the batch request.
      This is to ensure that Tyk is not being used to proxy requests to other
      hosts outside of the upstream API being accessed.


      Batch requests are created by POSTING to the `/{listen_path}/tyk/batch/`
      endpoint. These requests **do not require a valid key**, but their request
      list does.


      <h3>Sample Request</h3>

          ```{json}
          {
            "requests": [
              {
                "method": "GET",
                "headers": {
                  "x-tyk-test": "1",
                  "x-tyk-version": "1.2",
                  "authorization": "1dbc83b9c431649d7698faa9797e2900f"
                },
                "body": "",
                "relative_url": "get"
            },
            {
              "method": "GET",
              "headers": {
                "x-tyk-test": "2",
                "x-tyk-version": "1.2",
                "authorization": "1dbc83b9c431649d7698faa9797e2900f"
              },
              "body": "",
              "relative_url": "get"
              }
            ],
            "suppress_parallel_execution": false
          }
          ```

      The response will be a structured reply that encapsulates the responses
      for each of the outbound requests. If `suppress_parallel_execution` is set
      to `true`, requests will be made synchronously. If set to `false` then
      they will run in parallel and the response order is not guaranteed.


      <h3>Sample Response</h3>

        ```
        [
          {
            "relative_url": "get",
            "code": 200,
            "headers": {
              "Access-Control-Allow-Credentials": [
                "true"
              ],
              "Access-Control-Allow-Origin": [
                "*"
              ],
              "Content-Length": [
                "497"
              ],
              "Content-Type": [
                "application/json"
              ],
              "Date": [
                "Wed, 12 Nov 2014 15:32:43 GMT"
              ],
              "Server": [
                "gunicorn/18.0"
              ],
              "Via": [
                "1.1 vegur"
              ]
            },
            "body": "{
          "args": {},
          "headers": {
            "Accept-Encoding": "gzip",
            "Authorization": "1dbc83b9c431649d7698faa9797e2900f",
            "Connect-Time": "2",
            "Connection": "close",
            "Host": "httpbin.org",
            "Total-Route-Time": "0",
            "User-Agent": "Go 1.1 package http",
            "Via": "1.1 vegur",
            "X-Request-Id": "6a22499a-2776-4aa1-80c0-686581a8be4d",
            "X-Tyk-Test": "2",
            "X-Tyk-Version": "1.2"
          },
          "origin": "127.0.0.1, 62.232.114.250",
          "url": "http://httpbin.org/get"
        }"
            },
            {
              "relative_url": "get",
              "code": 200,
              "headers": {
                "Access-Control-Allow-Credentials": [
                  "true"
                ],
                "Access-Control-Allow-Origin": [
                  "*"
                ],
                "Content-Length": [
                  "497"
                ],
                "Content-Type": [
                  "application/json"
                ],
                "Date": [
                  "Wed, 12 Nov 2014 15:32:43 GMT"
                ],
                "Server": [
                  "gunicorn/18.0"
                ],
                "Via": [
                  "1.1 vegur"
                ]
              },
              "body": "{
          "args": {},
          "headers": {
            "Accept-Encoding": "gzip",
            "Authorization": "1dbc83b9c431649d7698faa9797e2900f",
            "Connect-Time": "7",
            "Connection": "close",
            "Host": "httpbin.org",
            "Total-Route-Time": "0",
            "User-Agent": "Go 1.1 package http",
            "Via": "1.1 vegur",
            "X-Request-Id": "1ab61f50-51ff-4828-a7e2-17240385a6d2",
            "X-Tyk-Test": "1",
            "X-Tyk-Version": "1.2"
          },
          "origin": "127.0.0.1, 62.232.114.250",
          "url": "http://httpbin.org/get"
        }"
            }
        ]
        ```
      With the body for each request string encoded in the `body` field.


      * `expire_analytics_after`: If you are running a busy API, you may want to
      ensure that your MongoDB database does not overflow with old data. Set the
      `expire_analytics_after` value to the number of seconds you would like the
      data to last for. Setting this flag to anything above `0` will set an
      `expireAt` field for each record that is written to the database.


      **Important:** Tyk will not create the expiry index for you. In order to
      implement data expiry for your analytics data, ensure that the index is
      created This is easily achieved using the [MongoDB command line
      interface](https://docs.mongodb.com/getting-started/shell/client/).


      * `dont_set_quota_on_create`: This setting defaults to `false`, but if set
      to `true`, when the API is used to edit, create or add keys, the quota
      cache in Redis will not be re-set. By default, all updates or creates to
      Keys that have Quotas set will re-set the quota (This has been the default
      behaviour since 1.0).

        This behaviour can be bypassed on a case-by-case basis by using the `suppress_reset` parameter when making a REST API request. This is the advised mode of operation as it allows for manual, granular control over key quotas and reset timings.

      * `cache_options`: This section enables you to configure the caching
      behaviour of Tyk and to enable or disable the caching middleware for your
      API.


      * `cache_options.enable_cache`: Set this value to `true` if the cache
      should be enabled for this endpoint, setting it to false will stop all
      caching behaviour.


      * `cache_options.cache_timeout`: The amount of time, in seconds, to keep
      cached objects, defaults to `60` seconds.


      * `cache_options.cache_all_safe_requests`: Set this to `true` if you want
      all *safe* requests (GET, HEAD, OPTIONS) to be cached. This is a blanket
      setting for APIs where caching is required but you don't want to set
      individual paths up in the definition.


      * `cache_options.enable_upstream_cache_control`: Set this to `true` if you
      want your application to control the cache options for Tyk (TTL and
      whether to cache or not). See
      [Caching](/docs/basic-config-and-security/reduce-latency/caching/) for
      more details.


      * `response_processors`: Response processors need to be specifically
      defined so they are loaded on API creation, otherwise the middleware will
      not fire. In order to have the two main response middleware components
      fire, the following configuration object should be supplied.


      ```{json}
        "response_processors": [
          {
              "name": "header_injector",
              "options": {
                  "add_headers": {"name": "value"},
                  "remove_headers": ["name"]
              }
          },
          {
            "name": "response_body_transform",
            "options": {}
          }
        ]
      ```


      The options for the `header_injector` are global, and will apply to all
      outbound requests.
    name: Batch requests
paths:
  /hello:
    get:
      description: "Use this endpoint to check the health and liveness of the Tyk
        Gateway. Call it to verify that the gateway process is running and that
        its dependent components (e.g. Redis) are reachable before routing
        traffic or performing administrative operations. Returns a status object
        with an overall 'status' field ('pass'/'fail') and per-component details
        including type, status, and timestamp. Note: from v2.7.5 the endpoint
        path can be renamed via the `health_check_endpoint_name` configuration
        option."
      operationId: hello
      responses:
        "200":
          content:
            application/json:
              example:
                description: Tyk GW
                details:
                  redis:
                    componentType: datastore
                    status: pass
                    time: 2020-05-19T03:42:55+01:00
                status: pass
                version: v5.5.0-dev
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
          description: Success.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "405":
          content:
            application/json:
              example:
                message: Method Not Allowed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Method Not Allowed
      summary: Check the health of the Tyk Gateway.
      tags:
        - Health Checking
  /tyk/apis:
    get:
      description: Use this endpoint to retrieve the full list of API definitions
        currently loaded on the Tyk Gateway node. Call it when you need to
        discover available APIs, inspect their configuration (authentication,
        proxy settings, versioning), or obtain API IDs required by other
        operations such as fetching, updating, or deleting a specific API.
        Returns an array of APIDefinition objects; each object includes fields
        such as api_id, name, org_id, proxy target URL, authentication method,
        and version data.
      operationId: list_apis
      responses:
        "200":
          content:
            application/json:
              example:
                - api_id: b84fe1a04e5648927971c0557971565c
                  auth:
                    auth_header_name: authorization
                  definition:
                    key: version
                    location: header
                  name: Tyk Test API
                  org_id: 664a14650619d40001f1f00f
                  proxy:
                    listen_path: /tyk-api-test/
                    strip_listen_path: true
                    target_url: https://httpbin.org
                  use_oauth2: true
                  version_data:
                    not_versioned: true
                    versions:
                      Default:
                        name: Default
              schema:
                items:
                  $ref: "#/components/schemas/APIDefinition"
                type: array
          description: List of API definitions.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: Get list of apis
      tags:
        - APIs
    post:
      description: Create API. A single Tyk node can have its API Definitions queried,
        deleted and updated remotely. This functionality enables you to remotely
        update your Tyk definitions without having to manage the files manually.
      operationId: create_api
      parameters:
        - description: The base API which the new version will be linked to.
          example: 663a4ed9b6be920001b191ae
          in: query
          name: base_api_id
          required: false
          schema:
            type: string
        - description: The version name of the base API while creating the first version.
            This doesn't have to be sent for the next versions but if it is set,
            it will override base API version name.
          example: Default
          in: query
          name: base_api_version_name
          required: false
          schema:
            type: string
        - description: The version name of the created version.
          example: v2
          in: query
          name: new_version_name
          required: false
          schema:
            type: string
        - description: If true, the new version is set as default version.
          example: true
          in: query
          name: set_default
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            example:
              api_id: b84fe1a04e5648927971c0557971565c
              auth:
                auth_header_name: authorization
              definition:
                key: version
                location: header
              name: Tyk Test API
              org_id: 664a14650619d40001f1f00f
              proxy:
                listen_path: /tyk-api-test/
                strip_listen_path: true
                target_url: https://httpbin.org
              use_oauth2: true
              version_data:
                not_versioned: true
                versions:
                  Default:
                    name: Default
            schema:
              $ref: "#/components/schemas/APIDefinition"
      responses:
        "200":
          content:
            application/json:
              example:
                action: added
                key: b84fe1a04e5648927971c0557971565c
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: API created.
        "400":
          content:
            application/json:
              example:
                message: Request malformed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                message: file object creation failed, write error
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Create an API
      tags:
        - APIs
  /tyk/apis/{apiID}:
    delete:
      description: "Call this operation when you want to permanently remove an API
        definition from the file store. Use it instead of updating when the API
        should no longer exist at all. Note: the API will continue to serve live
        traffic until a hot-reload is triggered — always follow this call with a
        reload request to deactivate the endpoint. Returns status 'ok' and
        action 'deleted' on success."
      operationId: delete_api
      parameters:
        - description: The API ID.
          example: 1bd5c61b0e694082902cf15ddcc9e6a7
          in: path
          name: apiID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                action: deleted
                key: 1bd5c61b0e694082902cf15ddcc9e6a7
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: API deleted.
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: API not found
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: API not found.
        "500":
          content:
            application/json:
              example:
                message: Delete failed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Deleting an API definition with ID.
      tags:
        - APIs
    get:
      description: Use this endpoint to retrieve the complete API definition for a
        single, known API by its unique identifier. Call it when you already
        have an apiID (obtainable from GET /tyk/apis) and need the full
        configuration details — such as authentication settings, proxy rules,
        middleware, and version data — for inspection, comparison, or as input
        to an update operation. Returns a single APIDefinition object. If the
        requested API is a version of a base API, the response header
        'x-tyk-base-api-id' will contain the ID of the parent base API. Returns
        404 if the apiID does not match any loaded API.
      operationId: get_api
      parameters:
        - description: The unique identifier of the API to retrieve. Obtain this value
            from the 'api_id' field returned by GET /tyk/apis. Example values
            look like 'b84fe1a04e5648927971c0557971565c' (hex string) or a
            human-readable slug such as 'keyless' depending on how the API was
            created.
          example: keyless
          in: path
          name: apiID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                api_id: b84fe1a04e5648927971c0557971565c
                auth:
                  auth_header_name: authorization
                definition:
                  key: version
                  location: header
                name: Tyk Test API
                org_id: 664a14650619d40001f1f00f
                proxy:
                  listen_path: /tyk-api-test/
                  strip_listen_path: true
                  target_url: https://httpbin.org
                use_oauth2: true
                version_data:
                  not_versioned: true
                  versions:
                    Default:
                      name: Default
              schema:
                $ref: "#/components/schemas/APIDefinition"
          description: API definition.
          headers:
            x-tyk-base-api-id:
              description: ID of the base API if the requested API is a version.
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: API not found.
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: API not found.
      summary: Get API definition with it's ID.
      tags:
        - APIs
    put:
      description: >-
        Updating an API definition uses the same signature and object as a
        `POST`, however it will first ensure that the API ID that is being
        updated is the same as the one in the object being `PUT`.


        Updating will completely replace the file descriptor and will not change
        an API Definition that has already been loaded, the hot-reload endpoint
        will need to be called to push the new definition to live.
      operationId: update_api
      parameters:
        - description: The API ID.
          example: 1bd5c61b0e694082902cf15ddcc9e6a7
          in: path
          name: apiID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              api_id: b84fe1a04e5648927971c0557971565c
              auth:
                auth_header_name: authorization
              definition:
                key: version
                location: header
              name: Update the API name sample
              org_id: 664a14650619d40001f1f00f
              proxy:
                listen_path: /update-listen-path
                strip_listen_path: true
                target_url: https://tyk.io/api
              use_oauth2: true
              version_data:
                not_versioned: true
                versions:
                  Default:
                    name: Default
            schema:
              $ref: "#/components/schemas/APIDefinition"
      responses:
        "200":
          content:
            application/json:
              example:
                action: modified
                key: 1bd5c61b0e694082902cf15ddcc9e6a7
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: "Returns a JSON object with 'status' ('ok'), 'action' ('modified'),
            and 'key' (the API ID) confirming the update was persisted to the
            file store. Note: the live gateway is not affected until a
            hot-reload is triggered via the reload endpoint."
        "400":
          content:
            application/json:
              example:
                message: Request malformed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: API not found
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: API not found.
        "500":
          content:
            application/json:
              example:
                message: File object creation failed, write error.
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Updating an API definition with its ID.
      tags:
        - APIs
  /tyk/apis/{apiID}/versions:
    get:
      description: Use this operation to retrieve all versions associated with a
        specific API (identified by its API ID). Call it when you need to
        discover which versions exist for an API, check default version flags,
        or filter versions by name or access type. Returns a list of version
        metadata objects, each including the version's ID, name, expiration
        date, whether it is the default version, and whether it is
        internal-only. Use the optional search text parameter to filter by name
        and the access type parameter to narrow results by access level.
      operationId: list_api_versions
      parameters:
        - description: The API ID.
          example: keyless
          in: path
          name: apiID
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/SearchText"
        - $ref: "#/components/parameters/AccessType"
      responses:
        "200":
          content:
            application/json:
              example:
                apis:
                  - expirationDate: ""
                    id: keyless
                    internal: false
