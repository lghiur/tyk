  /tyk/oauth/refresh/{keyName}:
    delete:
      description: Call this endpoint to immediately revoke an OAuth refresh token,
        preventing it from being used to obtain new access tokens. Use this when
        a user logs out, when a security incident is detected, or when rotating
        OAuth credentials. Requires the refresh token value and the associated
        API ID.
      operationId: invalidate_oauth_refresh
      parameters:
        - description: The OAuth refresh token to invalidate. This is the refresh token
            string issued to the OAuth client, not the client_id.
          example: 2a06b398c17f46908de3dffcb71ef87df
          in: path
          name: keyName
          required: true
          schema:
            type: string
        - description: The API id
          example: b84fe1a04e5648927971c0557971565c
          in: query
          name: api_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                action: deleted
                key: 2a06b398c17f46908de3dffcb71ef87df
                status: ok
              schema:
                $ref: "#/components/schemas/ApiModifyKeySuccess"
          description: Deleted
        "400":
          content:
            application/json:
              example:
                message: Missing parameter api_id
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: missing api_Id query parameter
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                message: API for this refresh token not found
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Not Found
        "500":
          content:
            application/json:
              example:
                message: Failed to invalidate refresh token
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Internal server error.
      summary: Invalidate OAuth refresh token
      tags:
        - OAuth
  /tyk/oauth/revoke:
    post:
      description: Revoke a single OAuth access or refresh token for a given client.
        Call this tool when you need to invalidate a specific token (e.g. on
        logout or token compromise). Requires the token string and client_id;
        optionally supply token_type_hint to target only access_token or
        refresh_token. Returns a status message confirming successful
        revocation.
      operationId: revoke_single_token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                client_id:
                  description: id of oauth client
                  example: 2a06b398c17f46908de3dffcb71ef87df
                  type: string
                org_id:
                  example: 6492f66e6ebbc56c6a6bf022
                  type: string
                  description: The organisation ID that owns the OAuth client. If omitted, the
                    gateway will infer the organisation from the authenticated
                    context.
                token:
                  description: token to be revoked
                  example: eyJvcmciOiI1ZTIwOTFjNGQ0YWVmY2U2MGMwNGZiOTIiLCJpZCI6IjIyODQ1NmFjNmJlMjRiMzI5MTIyOTdlODQ5NTc4NjJhIiwiaCI6Im11cm11cjY0In0=
                  type: string
                token_type_hint:
                  description: type of token to be revoked, if sent then the accepted values are
                    access_token and refresh_token. String value and optional,
                    of not provided then it will attempt to remove access and
                    refresh tokens that matches
                  example: access_token
                  type: string
              required:
                - token
                - client_id
              type: object
              description: "Note: request body must be sent as
                application/x-www-form-urlencoded (key=value pairs,
                URL-encoded), not JSON."
        description: "Send the request body as URL-encoded form fields (Content-Type:
          application/x-www-form-urlencoded). Encode each field as key=value
          pairs separated by ampersands, with percent-encoding applied to any
          special characters. Required fields are `token` and `client_id`."
      responses:
        "200":
          content:
            application/json:
              example:
                message: token revoked successfully
                status: ok
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: token revoked
        "400":
          content:
            application/json:
              example:
                message: cannot parse form. Form malformed
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: malformed form data
        "403":
          content:
            application/json:
              example:
                message: Attempted administrative access with invalid or missing key!
                status: error
              schema:
                $ref: "#/components/schemas/ApiStatusMessage"
          description: Forbidden
      summary: revoke token
      tags:
        - OAuth
  /tyk/oauth/revoke_all:
    post:
      description: Revoke every active OAuth access and refresh token issued to a
        specific OAuth client. Use this tool when a client's credentials are
        compromised, when decommissioning a client, or when a bulk logout is
        required. Requires client_id and client_secret for verification. Returns
        a status message confirming all tokens have been revoked. Returns 404 if
        the client does not exist.
      operationId: revoke_all_tokens
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                client_id:
                  description: id of oauth client
                  example: 2a06b398c17f46908de3dffcb71ef87df
                  type: string
                client_secret:
                  description: OAuth client secret to ensure that its a valid operation
                  example: MmQwNTI5NGQtYjU0YS00NjMyLWIwZjktNTZjY2M1ZjhjYWY0
                  type: string
                org_id:
                  example: 6492f66e6ebbc56c6a6bf022
                  type: string
                  description: The organisation ID that owns the OAuth client. If omitted, the
                    gateway will infer the organisation from the authenticated
